name: iOS TestFlight CI/CD

on:
  push:
    branches: [ "iOS_Testing" ]
  workflow_dispatch:

jobs:
  build-ios:
    # Pin to a stable image to avoid surprise Xcode changes
    runs-on: macos-14
    env:
      PROJECT: RHF_Foundation.csproj
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
      DOTNET_WORKLOAD_DISABLE_SUGGESTIONS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin Xcode to a version compatible with .NET 9 iOS packs you’ve been using
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show selected Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Pin a stable workload set so the iOS SDK doesn’t jump ahead
      - name: Pin workload set (global.json)
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "9.0.306",
              "rollForward": "latestFeature",
              "workloadVersion": "9.0.300"
            }
          }
          JSON
          echo "== global.json ==" && cat global.json

      - name: Install MAUI workloads
        run: |
          dotnet --info
          dotnet workload install maui --source https://api.nuget.org/v3/index.json
          dotnet workload list

      # ---------- Code signing (import every run) ----------
      - name: Import Apple Certificates (.p12 with private key)
        id: certs
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.P12_CERTIFICATE }}
          p12-password: ${{ secrets.P12_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        id: prov
        uses: apple-actions/install-provisioning-profile@v3
        with:
          provisioning-profile-base64: ${{ secrets.IOS_PROFILE_BASE64 }}

      # Optional but helpful: fail early if identity is missing/expired
      - name: Verify signing identities & keychain
        run: |
          echo "== Keychains ==" && security list-keychains
          echo "== Identities ==" && security find-identity -v -p codesigning || true
          COUNT=$(security find-identity -v -p codesigning | grep -c "Apple Distribution" || true)
          if [ "$COUNT" -lt 1 ]; then
            echo "No Apple Distribution identity found. Check cert expiry, secrets, or forked PR (no secrets)."
            exit 1
          fi

      # ---------- Versioning that always increases ----------
      # Keep your marketing version in the csproj; only set the BUILD NUMBER here.
      # Using a UTC timestamp (YYYYMMDDHHMMSS) guarantees monotonic increase for TestFlight.
      - name: Set versions
        run: |
          echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "Using BUILD_NUMBER=$BUILD_NUMBER"

      # ---------- Build + sign + create IPA ----------
      - name: Publish iOS (Release, signed)
        # Don’t attempt signing in PRs from forks (no secrets there)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # Grab the installed profile UUID for CodesignProvision
          PROFILE=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision | head -n 1)
          /usr/bin/security cms -D -i "$PROFILE" > profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist)

          dotnet publish ${{ env.PROJECT }} -c Release -f net9.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CreatePackage=true \
            -p:BuildIpa=true \
            -p:ApplicationVersion=${{ env.BUILD_NUMBER }} \
            -p:ApplicationId=org.rhfnow.rhffoundation \
            -p:CodesignKey="Apple Distribution" \
            -p:CodesignProvision="$UUID" \
            -p:CodesignTeamId="$TEAM" \
            -p:CodesignKeychain="${{ steps.certs.outputs.keychain-path }}"

      # Quick sanity check of what went in the Info.plist
      - name: Verify Info.plist versions
        run: |
          PLIST="bin/Release/net9.0-ios/ios-arm64/publish/RHF_Foundation.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" || true

      - name: Find IPA
        id: findipa
        run: |
          IPA_PATH=$(find . -type f -name "*.ipa" | head -n 1)
          echo "ipa=$IPA_PATH" >> $GITHUB_OUTPUT
          test -n "$IPA_PATH" && echo "Found IPA: $IPA_PATH" || (echo "No IPA found" && exit 1)

      - name: Upload app to TestFlight
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.findipa.outputs.ipa }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
