name: iOS TestFlight CI/CD

on:
  push:
    branches: [ "iOS_Testing" ]
  pull_request:
    branches: [ "iOS_Testing" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    env:
      PROJECT: RHF_Foundation.csproj
      BUNDLE_ID: org.rhfnow.rhffoundation
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
      DOTNET_WORKLOAD_DISABLE_SUGGESTIONS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show selected Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pin SDK/workload manifests
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "9.0.306",
              "rollForward": "latestFeature",
              "workloadVersion": "9.0.300"
            }
          }
          JSON
          echo "== global.json ==" && cat global.json

      - name: Install MAUI workloads
        run: |
          dotnet --info
          dotnet workload install maui --source https://api.nuget.org/v3/index.json
          dotnet workload list

      # --- Code signing material ---
      - name: Import Apple certificates (.p12)
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.P12_CERTIFICATE }}
          p12-password: ${{ secrets.P12_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Install provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/AppStore.mobileprovision"
          rm -f "$PROFILE" || true
          if base64 --help 2>&1 | grep -q -- '--decode'; then
            printf %s "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 --decode > "$PROFILE"
          else
            printf %s "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 -D > "$PROFILE"
          fi
          /usr/bin/security cms -D -i "$PROFILE" > profile.plist

          echo "== Provisioning Profile =="
          /usr/libexec/PlistBuddy -c 'Print :Name' profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist || true

          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist)
          PROFILE_BUNDLE_ID="${APP_ID#*.}"
          if [[ "$PROFILE_BUNDLE_ID" != "${BUNDLE_ID}" ]]; then
            echo "::error::Bundle ID mismatch. Profile has '$PROFILE_BUNDLE_ID' but workflow uses '${BUNDLE_ID}'."
            exit 1
          fi

          echo "PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)" >> $GITHUB_ENV
          echo "TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist)" >> $GITHUB_ENV

      - name: Capture codesign identity (Apple Distribution)
        id: codesign
        shell: bash
        run: |
          set -euo pipefail
          echo "== Available identities =="
          security find-identity -p codesigning -v || true
          ID=$(security find-identity -p codesigning -v | awk '/Apple Distribution/ {print $2; exit}')
          if [[ -z "$ID" ]]; then
            echo "::error::No 'Apple Distribution' identity found in keychain."
            exit 1
          fi
          echo "identity=$ID" >> $GITHUB_OUTPUT
          echo "Using identity: $ID"

      # --- Versioning ---
      - name: Set build & marketing versions
        run: |
          echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "MARKETING_VERSION=1.0.0" >> $GITHUB_ENV
          echo "Using BUILD_NUMBER=$BUILD_NUMBER, MARKETING_VERSION=$MARKETING_VERSION"

      # --- Restore for your exact TFM ---
      - name: Restore (iOS net9.0-ios18.0)
        run: dotnet restore ${{ env.PROJECT }} -p:TargetFramework=net9.0-ios18.0

      # --- Build/Publish signed .ipa ---
      - name: Publish iOS (Release, signed)
        run: |
          dotnet publish ${{ env.PROJECT }} -c Release -f net9.0-ios18.0 \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CreatePackage=true \
            -p:ApplicationId=${{ env.BUNDLE_ID }} \
            -p:ApplicationVersion=${{ env.BUILD_NUMBER }} \
            -p:ApplicationDisplayVersion=${{ env.MARKETING_VERSION }} \
            -p:CodesignKey="${{ steps.codesign.outputs.identity }}" \
            -p:CodesignProvision="${{ env.PROFILE_UUID }}" \
            -p:CodesignTeamId="${{ env.TEAM_ID }}"

      - name: Find IPA
        id: findipa
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=$(find ./bin/Release/net9.0-ios18.0/ios-arm64/publish -type f -name "*.ipa" -print -quit || true)
          if [[ -z "$CANDIDATE" ]]; then
            CANDIDATE=$(find . -type f -name "*.ipa" -print -quit || true)
          fi
          if [[ -z "$CANDIDATE" ]]; then
            echo "::error::No IPA found."
            exit 1
          fi
          echo "ipa=$CANDIDATE" >> $GITHUB_OUTPUT
          echo "Found IPA: $CANDIDATE"

      - name: Upload app to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.findipa.outputs.ipa }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
