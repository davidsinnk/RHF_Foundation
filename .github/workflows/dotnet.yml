name: iOS TestFlight CI/CD

on:
  push:
    branches: [ "iOS_Testing" ]
  pull_request:
    branches: [ "iOS_Testing" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      # Adjust these if your names/paths differ
      SOLUTION: RHF_Foundation.sln
      PROJECT: RHF_Foundation.csproj
      ENTITLEMENTS: Platforms/iOS/Entitlements.plist

    steps:


      - name: Toolchain diagnostics
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== dotnet ==="
          dotnet --info
          dotnet --list-sdks
          dotnet workload list
          echo "=== global.json (if any) ==="
          test -f global.json && cat global.json || echo "no global.json"
          echo "=== iOS workload manifests that mention 26 ==="
          find ~/.dotnet/sdk-manifests -name WorkloadManifest.json -print -exec sh -c "grep -n \"26\\.0\" {} || true" \;

      - name: Checkout
        uses: actions/checkout@v4

      # Use a real Xcode version (or 'latest-stable')
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Show selected Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install/Update MAUI workloads
        run: |
          dotnet --info
          dotnet workload install maui
          dotnet workload update
          dotnet workload list

      # --- Import Apple Distribution cert (.p12 with private key) ---
      - name: Import Apple Certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.P12_CERTIFICATE }}
          p12-password: ${{ secrets.P12_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      # --- Install provisioning profile from Base64 (portable decode for macOS/GNU) ---
      - name: Install Provisioning Profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/AppStore.mobileprovision"
          if base64 --help 2>&1 | grep -q -- '--decode'; then
            printf %s "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 --decode > "$PROFILE"
          else
            printf %s "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 -D > "$PROFILE"
          fi
          /usr/bin/security cms -D -i "$PROFILE" > profile.plist
          echo "== Provisioning Profile Summary =="
          /usr/libexec/PlistBuddy -c 'Print :Name' profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :ExpirationDate' profile.plist || true

      # --- Capture exact Apple Distribution identity string from keychain ---
      - name: Capture codesign identity
        id: id
        shell: bash
        run: |
          echo "== Valid code signing identities =="
          security find-identity -p codesigning -v || true
          ID="$(security find-identity -p codesigning -v | awk -F\" '/Apple Distribution/ {print $2; exit}')"
          test -n "$ID"
          echo "identity=$ID" >> $GITHUB_OUTPUT
          echo "Using identity: $ID"

      # --- Capture provisioning profile Name (for CodesignProvision) ---
      - name: Capture profile name
        id: prof
        shell: bash
        run: |
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)
          test -n "$NAME"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "Using profile: $NAME"

      # --- Build signed device archive (.ipa) for TestFlight ---
      - name: Publish iOS (Release, signed)
        run: |
          dotnet publish ${{ env.PROJECT }} -c Release -f net9.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CreatePackage=true \
            -p:CodesignKey="${{ steps.id.outputs.identity }}" \
            -p:CodesignProvision="${{ steps.prof.outputs.name }}" \
            -p:CodesignEntitlements="${{ env.ENTITLEMENTS }}"

      # --- Find the produced .ipa ---
      - name: Find IPA
        id: findipa
        shell: bash
        run: |
          IPA_PATH=$(find . -type f -name "*.ipa" | head -n 1)
          echo "ipa=$IPA_PATH" >> $GITHUB_OUTPUT
          test -n "$IPA_PATH" && echo "Found IPA: $IPA_PATH" || (echo "No IPA found" && exit 1)

      # --- Upload to TestFlight with App Store Connect API key ---
      - name: Upload app to TestFlight
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.findipa.outputs.ipa }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
