name: iOS TestFlight CI/CD

on:
  push:
    branches: [ "iOS_Testing" ]
  pull_request:
    branches: [ "iOS_Testing" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      PROJECT: RHF_Foundation.csproj
      ENTITLEMENTS: Platforms/iOS/Entitlements.plist
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
      DOTNET_WORKLOAD_DISABLE_SUGGESTIONS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin a real Xcode version that matches stable .NET 9 iOS workloads
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show selected Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Pin a stable workload set to avoid preview iOS packs that demand Xcode 26
      - name: Pin workload set (global.json)
        shell: bash
        run: |
          cat > global.json << 'JSON'
          {
            "sdk": {
              "version": "9.0.306",
              "rollForward": "latestFeature",
              "workloadVersion": "9.0.300"
            }
          }
          JSON
          echo "== global.json ==" && cat global.json

      # Install MAUI workloads from NuGet ONLY (do not 'workload update')
      - name: Install stable MAUI workloads
        run: |
          dotnet --info
          dotnet workload install maui --source https://api.nuget.org/v3/index.json
          dotnet workload list

      # ---- Code signing material ----
      - name: Import Apple Certificates (.p12 with private key)
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.P12_CERTIFICATE }}
          p12-password: ${{ secrets.P12_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Install Provisioning Profile (App Store Connect)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/AppStore.mobileprovision"
          rm -f "$PROFILE" || true
          # Portable Base64 decode (GNU/BSD)
          if base64 --help 2>&1 | grep -q -- '--decode'; then
            printf %s "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 --decode > "$PROFILE"
          else
            printf %s "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 -D > "$PROFILE"
          fi
          /usr/bin/security cms -D -i "$PROFILE" > profile.plist
          echo "== Profile basics =="
          /usr/libexec/PlistBuddy -c 'Print :Name' profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist || true

      # Capture the exact Apple Distribution identity installed in the temp keychain
      - name: Capture codesign identity
        id: id
        shell: bash
        run: |
          echo "== Valid code signing identities =="
          security find-identity -p codesigning -v || true
          ID="$(security find-identity -p codesigning -v | awk -F\" '/Apple Distribution/ {print $2; exit}')"
          test -n "$ID"
          echo "identity=$ID" >> $GITHUB_OUTPUT
          echo "Using identity: $ID"

      # Capture provisioning profile UUID (bullet-proof vs name)
      - name: Capture profile UUID
        id: profuuid
        shell: bash
        run: |
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)
          test -n "$UUID"
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
          echo "Using profile UUID: $UUID"

      # Capture Team ID from the profile (avoid hardcoding)
      - name: Capture team id
        id: team
        shell: bash
        run: |
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' profile.plist)
          test -n "$TEAM"
          echo "id=$TEAM" >> $GITHUB_OUTPUT
          echo "Using Team ID: $TEAM"

      # ---- Build signed .ipa for device/TestFlight ----
      - name: Publish iOS (Release, signed)
        run: |
          dotnet publish RHF_Foundation.csproj -c Release -f net9.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CreatePackage=true \
            -p:ApplicationId=org.rhfnow.rhffoundation \
            -p:CodesignKey="${{ steps.id.outputs.identity }}" \
            -p:CodesignProvision="${{ steps.profuuid.outputs.uuid }}" \
            -p:CodesignTeamId="${{ steps.team.outputs.id }}" \
            -p:CodesignEntitlements="Platforms/iOS/Entitlements.plist"


      - name: Find IPA
        id: findipa
        shell: bash
        run: |
          IPA_PATH=$(find . -type f -name "*.ipa" | head -n 1)
          echo "ipa=$IPA_PATH" >> $GITHUB_OUTPUT
          test -n "$IPA_PATH" && echo "Found IPA: $IPA_PATH" || (echo "No IPA found" && exit 1)

      - name: Upload app to TestFlight
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.findipa.outputs.ipa }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}


