name: iOS Testflight CI/CD

on:
  push:
    branches: [ "iOS_Testing" ]
  pull_request:
    branches: [ "iOS_Testing" ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@v1.6.0
      with:
        xcode-version: 26.0
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.x
    - name: Install MAUI workload
      run: dotnet workload install maui


    - name: Import Apple Certificates
      uses: apple-actions/import-codesign-certs@v3
      with:
        p12-file-base64: ${{ secrets.P12_CERTIFICATE }}
        p12-password: ${{ secrets.P12_CERTIFICATE_PASSWORD }}
        keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

    - name: Inspect keychains and identities
      shell: bash
      run: |
        set -euxo pipefail
        echo "== Keychains in search list =="
        security list-keychains
    
        echo "== Default keychain =="
        security default-keychain -d user
    
        echo "== Valid code signing identities (all keychains) =="
        security find-identity -p codesigning -v || true
    
        echo "== Try to extract the installed cert from the provided .p12 =="
        # (This does NOT print your private key)
        echo "${{ secrets.P12_CERTIFICATE }}" | base64 -d > cert.p12
        openssl pkcs12 -in cert.p12 -nodes -nokeys -passin pass:${{ secrets.P12_CERTIFICATE_PASSWORD }} \
          | openssl x509 -noout -subject -issuer -enddate      
        - name: Debug signing identities and profiles
          run: |
            security find-identity -p codesigning -v
              ls -la ~/Library/MobileDevice/"Provisioning Profiles" || true
          
      # 2) Install the provisioning profile
    - name: Install Provisioning Profile
      run: |
        mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
        echo "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 --decode > \
        ~/Library/MobileDevice/"Provisioning Profiles"/AppStore.mobileprovision
      
    # --- (Optional) Debug what was installed ---
    - name: Debug signing state
      run: |
          security find-identity -p codesigning -v || true
          ls -la ~/Library/MobileDevice/"Provisioning Profiles" || true


    - name: Verify signing identities
      id: ids
      shell: bash
      run: |
        echo "== Keychains in search list =="
        security list-keychains
        echo "== Valid code signing identities =="
        security find-identity -p codesigning -v || true

        # Capture the first Apple Distribution identity EXACTLY as installed
        IDENTITY=$(security find-identity -p codesigning -v \
          | awk -F\" '/Apple Distribution/ {print $2; exit}')
        if [ -z "$IDENTITY" ]; then
          echo "No Apple Distribution identity found. Check your .p12 and password."
          exit 1
        fi
        echo "identity=$IDENTITY" >> $GITHUB_OUTPUT
        echo "Using identity: $IDENTITY"

        echo "== Installed profiles =="
        ls -la ~/Library/MobileDevice/"Provisioning Profiles" || true
        
    - name: Build
      run: dotnet publish RHF_Foundation.csproj -f net9.0-ios -c Release -p:ArchiveOnBuild=true -p:EnableAssemblyILStripping=false
    - name: List build output
      run: ls -R RHF_Foundation/bin/Debug/net9.0-ios/publish/
    - name: Upload app to TestFlight
      uses: Apple-Actions/upload-testflight-build@v1
      with:
        app-path: 'RHF_Foundation/bin/Release/net9.0-ios/publish/RHF_Foundation.ipa'
        issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
        api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
        api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
